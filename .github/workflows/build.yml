name: Build

on:
  push:
    branches: [main]
    # Ignore stuff that not a code change
    paths-ignore:
      - "**.md"
      - ".vscode/**"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

# A newer push to main supersedes an older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release asset names will be san-box-<version>-<suffix>
env:
  CARGO_TERM_COLOR: always
  ASSET_NSIS: Windows-Installer.exe
  ASSET_MSI: Windows-Installer-MSI.msi
  ASSET_PORTABLE: Windows-Portable.zip
  ASSET_APPIMAGE: Linux.AppImage
  ASSET_DEB: Linux-Debian-Ubuntu.deb
  ASSET_RPM: Linux-Fedora.rpm

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the other
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - name: windows-x64
            os: windows-latest
            bundles: nsis,msi

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - name: Build
        shell: bash
        env:
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Read version
        shell: bash
        run: echo "VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - name: Collect the bundles
        shell: bash
        run: |
          # Keep release assets separate from Vite's root dist/ directory.
          rm -rf release-assets
          mkdir -p release-assets

          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -print0 |
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            case "$name" in
              *-setup.exe) kind=$ASSET_NSIS ;;
              *.msi) kind=$ASSET_MSI ;;
              *.AppImage) kind=$ASSET_APPIMAGE ;;
              *.deb) kind=$ASSET_DEB ;;
              *.rpm) kind=$ASSET_RPM ;;
              *) echo "::error::No release name for the bundle $name."; exit 1 ;;
            esac
            out="release-assets/san-box-$VERSION-$kind"
            if [ -e "$out" ]; then echo "::error::Two bundles would both be named $out."; exit 1; fi
            cp "$f" "$out"
          done

      - name: Portable app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exe="src-tauri/target/release/san-box.exe"
          if [ ! -f "$exe" ]; then
            echo "::error::No application executable found at $exe."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/portable"
          cp "$exe" "$RUNNER_TEMP/portable/"
          (cd "$RUNNER_TEMP/portable" && 7z a "$GITHUB_WORKSPACE/release-assets/san-box-$VERSION-$ASSET_PORTABLE" ./*.exe)

      - name: List assets
        shell: bash
        run: ls -la release-assets

      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0 # installers are already compressed
